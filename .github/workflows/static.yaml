# Ngwg GitHub Pages 部署工作流
#
# 用法：将本文件复制到你的站点仓库的 .github/workflows/generate-website.yaml，
# 在仓库 Settings → Pages 中把 Source 设为 "GitHub Actions" 即可。
# 之后每次 push 到 main（或手动触发）都会在干净的 Runner 上全新安装 Ngwg 并构建。
#
# 工作流做的事：
#   1. 安装 fish 与 bun（git 在 Runner 上已预装）
#   2. 浅克隆 Ngwg-cli 到工作区之外（避免 CLI 仓库文件混入站点源文件）
#   3. 在站点仓库根目录运行 ngwg.fish build
#      —— Ngwg-core、默认主题与插件由 bootstrap 在构建时自动 git clone 到
#         <root>/.ngwg/，无需预先安装；本工作流不做缓存，保证每次都是干净安装
#   4. 将 public/ 上传并部署到 GitHub Pages
#
# 可按需修改：触发分支、NGWG_CLI_REPO / NGWG_CLI_REF（换成 fork 或固定版本）、
# build 步骤前追加 bun install（仅当你的插件需要 npm 依赖时）。

name: Generate Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# 同一时间只保留一次 Pages 部署，新排队等待、不打断进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NGWG_CLI_REPO: https://github.com/Ngwgers/Ngwg-cli
  NGWG_CLI_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Download Ngwg-cli
        run: |
          git clone --depth 1 --branch "$NGWG_CLI_REF" "$NGWG_CLI_REPO" "$RUNNER_TEMP/ngwg-cli"

      - name: Build site
        run: |
          fish "$RUNNER_TEMP/ngwg-cli/bin/ngwg.fish" update
          fish "$RUNNER_TEMP/ngwg-cli/bin/ngwg.fish" build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Artifact metadata can take time to become visible after upload.
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if count=$(gh api --paginate --slurp \
              "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$ARTIFACT_NAME" '[.[].artifacts[] | select(.name == $name and .expired == false)] | length'); then
              if [ "$count" -eq 1 ]; then
                exit 0
              fi
              echo "Waiting for $ARTIFACT_NAME: found $count artifact(s), attempt $attempt/12"
            else
              echo "Artifact query failed, attempt $attempt/12"
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "::error::Expected one available artifact named $ARTIFACT_NAME. Check the build upload logs and re-run the deploy job."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
