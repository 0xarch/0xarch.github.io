# ngwg configuration
title: 0xarch's Site
description: The shelter
baseurl: /
theme:
  firefly:
    themeColor:
      defaultMode: system
      hue: 200
    navbar:
      mode: dynamic
      menuAlign: left
      logo:
        light: 'data:image/svg+xml;base64,'
        dark: 'data:image/svg+xml;base64,'
    banner:
      mode: banner
      homeText:
        enable: true
        typewriter:
          enable: true
          speed: 125
          deleteSpeed: 175
        title: "0xarch's Site"
        titleSize: 1rem
        subtitle:
          - No Mountain Too High, No Ocean Too Deep
          - Graciously, I Come Onto Earth
          - Last MADMAN Standing
          - I Hate Violence But, If This Is The Only Way
          - Stand, And Die Like A MAN
          - A Marvelous Design
        links: []
      desktop:
        - /extra/banner.webp
      mobile:
        - /extra/banner.webp
    sidebar:
      enable: true
      position: both
      hideOnPostPage: false
      left: [profile, categories, tags]
      right: [toc, stats, announcement, recent]
    announcement:
      enable: true
      title: 公告
      content: 本博客已经迁移至 Ngwg .
      link:
        enable: true
        text: 了解 Ngwg
        url: https://github.com/Ngwgers/Ngwg-cli
        external: true
    profile:
      name: 0xarch
      bio: "Weird little guy"
      avatar: "/extra/avatar.webp"
      links:
        - name: GitHub
          icon: github
          url: "https://github.com/0xarch/"
        - name: Codeberg
          icon: codeberg
          url: "https://codeberg.org/0xarch/"
        - name: RSS
          icon: rss
          url: "/rss.xml"
    siteStats:
      enable: true
      startDate: "2024-03-04"
    postList:
      stats:
        published: true
        words: true
        reading: true
    license:
      enable: true
    search:
      enable: true
      limit: 12
    recent:
      enable: true
themes:
  firefly: https://github.com/0xarch/firefly-theme
  pacific: https://github.com/Ngwgers/Ngwg-default-theme
source_dir: source
public_dir: public
plugins:
  seo: https://github.com/Ngwgers/Ngwg-ext-seo
  files:
    option:
      chunk_size: 500
      segment_threshold: 1000
  feature:
    option:
      copy_files:
        - extra
        - BingSiteAuth.xml
